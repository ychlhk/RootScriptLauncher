name: Build Android APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.4

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Sign Release APK when signing secrets are configured
      id: sign_release
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
           [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
           [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
           [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
          echo "::warning::No persistent signing secrets; generating a one-time test signing key. This APK cannot update an existing installation signed with another key."
          TEMP_SIGNING=true
          ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          ANDROID_KEY_ALIAS="temporary-ci-test-key"
        else
          TEMP_SIGNING=false
        fi

        KEYSTORE="$RUNNER_TEMP/release-signing.jks"
        SIGNED_APK="app/build/outputs/apk/release/RootScriptLauncher-release-signed.apk"
        UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

        if [ "$TEMP_SIGNING" = "true" ]; then
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=RootScriptLauncher Temporary CI Test"
        else
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        fi

        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        if [ -z "$APKSIGNER" ]; then
          echo "apksigner not found in Android SDK" >&2
          exit 1
        fi

        "$APKSIGNER" sign \
          --ks "$KEYSTORE" \
          --ks-key-alias "$ANDROID_KEY_ALIAS" \
          --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
          --key-pass env:ANDROID_KEY_PASSWORD \
          --out "$SIGNED_APK" \
          "$UNSIGNED_APK"

        "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
        rm -f "$KEYSTORE"
        echo "signed=true" >> "$GITHUB_OUTPUT"
        echo "temporary_signing=$TEMP_SIGNING" >> "$GITHUB_OUTPUT"

    - name: Upload signed APK artifact
      if: steps.sign_release.outputs.signed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: RootScriptLauncher-Release-Signed
        path: app/build/outputs/apk/release/RootScriptLauncher-release-signed.apk

    - name: Upload unsigned APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: RootScriptLauncher-Release-Unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        VERSION_NAME="$(sed -n 's/.*versionName[[:space:]]*["'\''"]\([^"'\''"]*\)["'\''"].*/\1/p' app/build.gradle | head -n 1)"
        if [ -z "$VERSION_NAME" ]; then
          echo "Could not determine versionName" >&2
          exit 1
        fi

        TAG="v$VERSION_NAME"
        NOTES="$(printf '%s\n' \
          "RootScriptLauncher $TAG" \
          "" \
          "Changes:" \
          "- Removed the two bundled scripts from the launcher." \
          "- Existing user-imported scripts remain supported." \
          "- Legacy bundled-script entries are cleaned up after upgrade." \
          "" \
          "Files:" \
          "- Installable signed APK is attached to this release." \
          "- If the file name contains CI-Temporary-Signed, it uses a one-time CI test key." \
          "- Temporary-signed builds CANNOT update an APK signed by another key; uninstall the old app first (back up imported scripts)." \
          "- For regular upgrades configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets." \
          "- Unsigned APK is a GitHub Actions artifact and is not installable.")"

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "RootScriptLauncher $TAG" --notes "$NOTES"
        else
          gh release create "$TAG" --target "$GITHUB_SHA" --title "RootScriptLauncher $TAG" --notes "$NOTES"
        fi

        gh release delete-asset "$TAG" "RootScriptLauncher-$TAG-Release-Unsigned.apk" --yes >/dev/null 2>&1 || true

        SIGNED_SRC="app/build/outputs/apk/release/RootScriptLauncher-release-signed.apk"
        if [ -f "$SIGNED_SRC" ]; then
          if [ "${{ steps.sign_release.outputs.temporary_signing }}" = "true" ]; then
            SIGNED_DST="$RUNNER_TEMP/RootScriptLauncher-$TAG-CI-Temporary-Signed.apk"
          else
            SIGNED_DST="$RUNNER_TEMP/RootScriptLauncher-$TAG-Release-Signed.apk"
          fi
          cp "$SIGNED_SRC" "$SIGNED_DST"
          gh release upload "$TAG" "$SIGNED_DST" --clobber
        fi
